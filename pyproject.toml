[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-executor-framework"
version = "0.1.0"
description = "Executor-only VLA framework for command-conditioned UI actions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
]

[project.optional-dependencies]
local = ["mss>=9.0", "pyautogui>=0.9.54", "pynput>=1.7.6", "Pillow>=10.0"]
train = ["torch>=2.2"]

[project.scripts]
vla = "scripts.vla_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["vla*"]

[tool.pytest.ini_options]
pythonpath = ["."]
